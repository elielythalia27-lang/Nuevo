name: Build & Sign Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Compilar APK Release Firmado
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código fuente del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle y Caché de Compilación
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: 'never'

      - name: Otorgar permisos de ejecución al Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew no encontrado, generando wrapper mediante Gradle..."
            gradle wrapper || true
          fi
          chmod +x gradlew || true

      - name: Generar variables de entorno locales (.env y .env.example)
        run: |
          touch .env && touch .env.example

      - name: Configurar Almacén de Claves Release (my-upload-key.jks)
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decodificando keystore desde GitHub Secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ ! -f my-upload-key.jks ] && [ ! -f release.keystore ]; then
            echo "Generando almacén de claves Release automatizado con keytool..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias "${{ secrets.KEY_ALIAS || 'uploadKey' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
              -dname "CN=DownloadFree, OU=Mobile, O=Eliel, L=Havana, ST=Havana, C=CU"
          fi
          # Asegurar copia en app/ para redundancia en cualquier contexto de ejecución
          cp -f my-upload-key.jks app/my-upload-key.jks || true

      - name: Compilar APK Release
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'uploadKey' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=daemon -Dksp.incremental=false -Dksp.incremental.intermodule=false --stacktrace
          else
            gradle :app:assembleRelease --no-daemon -Dkotlin.compiler.execution.strategy=daemon -Dksp.incremental=false -Dksp.incremental.intermodule=false --stacktrace
          fi

      - name: Verificar existencia del archivo APK Release
        run: |
          echo "Verificando artefactos generados en app/build/outputs/apk/release/:"
          ls -la app/build/outputs/apk/release/
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            echo "¡APK Release generado y firmado exitosamente!"
          else
            echo "::error::No se encontró ningún archivo APK en app/build/outputs/apk/release/"
            exit 1
          fi

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

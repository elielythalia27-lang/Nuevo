name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (DownloadFree)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 (Temurin) con caché Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Asignar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Preparar archivo .env para Secrets Gradle Plugin
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Preparar clave de firma base
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=DownloadFree,O=Android,C=US"
          fi

      - name: Compilar APK Release optimizado
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Organizar archivo APK
        run: |
          mkdir -p build/dist
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} build/dist/DownloadFree.apk \;
          ls -lh build/dist/DownloadFree.apk

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DownloadFree-APK
          path: build/dist/DownloadFree.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release con APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/DownloadFree.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
